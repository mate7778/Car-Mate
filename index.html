<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <title>Evening Drive — Highway</title>
  <style>
    :root{color-scheme:dark;--ice:#d9eee9;--muted:#a8b6b5;--glass:#0810159c;--accent:#ff4d4d}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;color:#f5f7f5;font-family:"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;overscroll-behavior:none}
    #game{position:relative;width:100%;height:100%;overflow:hidden;background:#252d31}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;position:relative;z-index:0}canvas:active{cursor:grabbing}
    
    .top{position:absolute;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px;background:linear-gradient(#071015a8,transparent);pointer-events:none;z-index:10}
    .brand{font-size:.7rem;letter-spacing:.2em;font-weight:800;color:#e1ece8;text-shadow:0 1px 8px #000}.brand small{display:block;margin-top:5px;color:#bacac5;font-size:.58rem;font-weight:500;letter-spacing:.13em}
    .stats{display:flex;gap:8px;pointer-events:none}.stat{min-width:80px;padding:8px 11px;border:1px solid #ffffff25;border-radius:10px;background:#0710158a;backdrop-filter:blur(9px);text-align:center;box-shadow:0 5px 20px #0002}.stat span{display:block;color:#adbfbb;font-size:.58rem;letter-spacing:.14em}.stat strong{display:block;margin-top:3px;font-size:1rem;font-weight:650;font-variant-numeric:tabular-nums}
    .gear-control{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;pointer-events:auto}.gear-control strong{min-width:14px;margin:0}.gear-control button{width:23px;height:22px;padding:0;border:1px solid #ffffff35;border-radius:6px;background:#ffffff18;color:#fff;font:700 .9rem "Segoe UI",sans-serif;cursor:pointer}.gear-control button:hover{background:#ffffff38}
    
    /* ===== Analog Gauges (Dashboard) ===== */
    .dashboard{position:absolute;bottom:18px;right:22px;display:flex;gap:15px;z-index:10;pointer-events:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.6))}
    .gauge{position:relative;width:120px;height:120px;background:radial-gradient(circle, #1a2225 0%, #0c1216 100%);border-radius:50%;border:3px solid #2a353b;box-shadow:inset 0 0 20px #000, 0 0 0 1px #000;transition:transform 0.2s, border-color 0.2s}
    
    .gauge.boost.overboost{border-color:#ff4d4d; box-shadow:inset 0 0 20px #000, 0 0 15px #ff4d4d}
    
    .gauge canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
    .gauge .label{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:.55rem;color:#adbfbb;letter-spacing:.15em;font-weight:600;text-shadow:0 1px 2px #000}
    .gauge .value{position:absolute;top:58%;left:0;right:0;text-align:center;font-size:1rem;color:var(--ice);font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 2px 4px #000}
    .gauge .value small{font-size:.55rem;color:var(--muted);font-weight:500}
    
    .instructions{position:absolute;left:20px;top:82px;padding:10px 13px;border:1px solid #ffffff20;border-radius:10px;background:#07101578;color:#d1ddda;font-size:.72rem;line-height:1.65;backdrop-filter:blur(8px);pointer-events:none;z-index:10}.instructions b{color:white;font-weight:650}
    .camera-toggle{position:absolute;top:88px;right:22px;padding:10px 15px;border:1px solid #ffffff45;border-radius:10px;background:#071015b8;color:#f5f7f5;font:600 .75rem "Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(9px);box-shadow:0 5px 18px #0002;z-index:10}.camera-toggle:hover{background:#17302ecc}
    .message{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 2px 16px #000;transition:opacity .5s;pointer-events:none;z-index:10}.message strong{display:block;font-size:clamp(1.5rem,4vw,3.2rem);font-weight:600;letter-spacing:.15em}.message span{display:block;margin-top:9px;color:#e0e8e4;font-size:.85rem;letter-spacing:.06em}.message.hide{opacity:0}
    
    /* ===== Car Selector UI ===== */
    .car-selector{position:absolute;left:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:15;pointer-events:auto;transition:opacity 0.4s ease, transform 0.4s ease}
    .car-selector.hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }
    .car-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #ffffff30;border-radius:12px;background:#071015c8;color:#e1ece8;font:600 .75rem "Segoe UI",sans-serif;cursor:pointer;backdrop-filter:blur(10px);transition:all 0.2s;text-align:left}
    .car-btn:hover{background:#17302ecc;transform:translateX(4px)}
    .car-btn.active{border-color:#ffdd88;background:#17302ecc;box-shadow:0 0 12px #ffdd8833}
    .car-btn .swatch{width:20px;height:20px;border-radius:50%;border:2px solid #ffffff50;flex-shrink:0}
    .car-btn .info{display:flex;flex-direction:column;gap:2px}
    .car-btn .name{font-size:.8rem;font-weight:700}
    .car-btn .spec{font-size:.6rem;color:#a8b6b5;letter-spacing:.05em}

    /* Mobile adjustments */
    @media(max-width:700px){
      .instructions{top:auto;bottom:110px;left:14px;font-size:.66rem}
      .camera-toggle{top:76px;right:13px;padding:9px 12px}
      .stat{min-width:68px;padding:7px}
      .top{padding:13px}
      .brand{font-size:.62rem}
      .stat span{font-size:.52rem}
      .stat strong{font-size:.88rem}
      .credit{display:none}
      
      .dashboard{bottom:105px;right:14px;gap:10px;transform:scale(0.8);transform-origin: bottom right;}
      .gauge{width:100px;height:100px}
      .gauge .value{top:60%;font-size:.9rem}
      .gauge .label{bottom:15px;font-size:.45rem}
      
      .car-selector{left:10px;bottom:220px;gap:6px;transform:scale(0.9);transform-origin: bottom left;}
      .car-btn{padding:6px 10px;gap:8px}
      .car-btn .name{font-size:.7rem}
      .car-btn .spec{font-size:.5rem}
      .car-btn .swatch{width:16px;height:16px}
    }
    @media(max-width:390px){
      .instructions{max-width:195px;bottom:103px}
      .touch{width:54px;height:54px}
      .pedals .touch{width:47px;height:67px}
      .stats{gap:4px}
      .dashboard{transform:scale(0.7);bottom:95px;}
      .car-selector{bottom:200px;transform:scale(0.8);}
    }
  
    /* ===== Mobile Touch Controls ===== */
    .toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%) translateY(10px);padding:8px 18px;border:1px solid #ffffff30;border-radius:20px;background:#071015d8;color:#ffd7d7;font:600 .7rem "Segoe UI",sans-serif;letter-spacing:.03em;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:14;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .mobile{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 16px 18px;z-index:9;pointer-events:none}
    .mobile .pad{display:flex;gap:14px;pointer-events:auto}
    .mobile .pedals{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
    .touch{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;width:64px;height:64px;border-radius:50%;border:1px solid #ffffff45;background:#ffffff16;color:#fff;font:700 1.6rem/64px "Segoe UI",sans-serif;text-align:center;backdrop-filter:blur(8px);box-shadow:0 5px 18px #0004}
    .touch:active{background:#ffffff45;transform:scale(.94)}
    .touch.go{width:64px;height:84px;border-radius:18px;background:#1fae5e33;border-color:#39d97b66;font:700 .78rem/84px "Segoe UI",sans-serif;color:#c8ffd8}
    .touch.go:active{background:#1fae5e88}
    .touch.stop{width:64px;height:84px;border-radius:18px;background:#c0333330;border-color:#ff5b5b66;font:700 .78rem/84px "Segoe UI",sans-serif;color:#ffd0d0}
    .touch.stop:active{background:#c0333388}
    @media(hover:none) and (pointer:coarse),(max-width:700px){.mobile{display:flex}}
    @media(max-width:700px){.credit{display:none}}
  </style>

<body>
<main id="game">
  <div class="top">
    <div class="brand">EVENING DRIVE<small>OPEN ROAD · FIRST PERSON</small></div>
    <div class="stats">
      <div class="stat"><span>GEAR</span><div class="gear-control"><button id="gearDown" type="button" aria-label="ลดเกียร์">−</button><strong id="gear">1</strong><button id="gearUp" type="button" aria-label="เพิ่มเกียร์">+</button></div></div>
      <div class="stat"><span>DISTANCE</span><strong><b id="distance">0.00</b> km</strong></div>
    </div>
  </div>
  
  <div class="instructions"><b>ขับรถ</b><br>W / ↑ เร่ง · S / ↓ เบรก<br>A D / ← → เลี้ยว · Q / E เปลี่ยนเกียร์<br><span id="cameraHint">C สลับมุม · R เริ่มใหม่</span></div>
  <button id="cameraToggle" class="camera-toggle" type="button" aria-label="สลับมุมกล้อง">มุมมอง: คนขับ</button>
  <div id="message" class="message"><strong>EVENING DRIVE</strong><span>กำลังโหลดรถ 3 มิติ…</span></div>
  <div id="toast" class="toast">ชนขอบทาง ลดความเร็วลง</div>
  
  <!-- ===== Dashboard มาตรวัดอนาล็อก ===== -->
  <div class="dashboard">
    <div class="gauge">
      <canvas id="rpmGauge" width="240" height="240"></canvas>
      <div class="label">x1000 RPM</div>
      <div class="value"><span id="rpmText">0.9</span></div>
    </div>
    <div class="gauge">
      <canvas id="speedGauge" width="240" height="240"></canvas>
      <div class="label">km/h</div>
      <div class="value"><span id="speedText">0</span></div>
    </div>
    <div class="gauge boost" id="boostGaugeBox">
      <canvas id="boostGauge" width="240" height="240"></canvas>
      <div class="label">BOOST PSI</div>
      <div class="value"><span id="boostText">0.0</span></div>
    </div>
  </div>

  <!-- ===== Car Selector ===== -->
  <div class="car-selector" id="carSelector"></div>

  <div class="mobile"><div class="pad"><button class="touch" data-key="ArrowLeft" aria-label="เลี้ยวซ้าย">‹</button><button class="touch" data-key="ArrowRight" aria-label="เลี้ยวขวา">›</button></div><div class="pedals"><button class="touch stop" data-key="ArrowDown">เบรก</button><button class="touch go" data-key="ArrowUp">เร่ง</button></div></div>
  <div class="credit">A QUIET ROAD · TAKE IT EASY</div>
</main>
<script src="./three.min.js"></script>
<script src="./GLTFLoader.js"></script>
<script src="./porsche-data.js"></script>
<script>
(() => {
  const THREE = window.THREE;
  const root = document.querySelector("#game");
  
  const speedText = document.querySelector("#speedText"); 
  const distanceText = document.querySelector("#distance"); 
  const gearText = document.querySelector("#gear"); 
  const rpmText = document.querySelector("#rpmText");
  const boostText = document.querySelector("#boostText");
  const boostGaugeBox = document.querySelector("#boostGaugeBox");
  const message = document.querySelector("#message"), toast = document.querySelector("#toast");
  const carSelector = document.querySelector("#carSelector");

  const CAR_SPECS = [
    { name: "Classic Blue",   color: 0x4a90d9, swatch: "#4a90d9", maxSpeed: 710, gearSpeed: [0,110,240,360,480,580,710], accel: [0,82,64,49,38,30,24] },
    { name: "Midnight Black", color: 0x1a1c1f, swatch: "#1a1c1f", maxSpeed: 750, gearSpeed: [0,120,260,390,510,620,750], accel: [0,95,72,55,42,33,26] },
    { name: "Racing Red",     color: 0xd91a1a, swatch: "#d91a1a", maxSpeed: 820, gearSpeed: [0,130,280,420,560,680,820], accel: [0,88,68,52,40,32,25] },
    { name: "Acid Green",     color: 0x8cd91a, swatch: "#8cd91a", maxSpeed: 680, gearSpeed: [0,100,220,340,460,560,680], accel: [0,100,80,62,48,38,30] },
    { name: "Phantom Silver", color: 0xc0c8d0, swatch: "#c0c8d0", maxSpeed: 780, gearSpeed: [0,125,270,405,540,660,780], accel: [0,90,70,54,41,33,26] }
  ];
  let currentCarSpec = CAR_SPECS[0];
  let currentCarIndex = 0;
  let hasStartedMoving = false;
  
  const speedGauge = document.getElementById('speedGauge');
  const rpmGauge = document.getElementById('rpmGauge');
  const boostGauge = document.getElementById('boostGauge');
  const ctxSpeed = speedGauge.getContext('2d');
  const ctxRpm = rpmGauge.getContext('2d');
  const ctxBoost = boostGauge.getContext('2d');

  const held = new Set();

  function drawGauge(ctx, val, min, max, redlineStart, redlineEnd) {
    const w = ctx.canvas.width, h = ctx.canvas.height;
    const cx = w/2, cy = h/2, r = w/2 - 18;
    ctx.clearRect(0,0,w,h);

    const startAngle = Math.PI * 0.75; 
    const endAngle = Math.PI * 2.25;
    const angleRange = endAngle - startAngle;
    const range = max - min;

    if (redlineStart !== undefined && redlineEnd !== undefined) {
      const a1 = startAngle + angleRange * ((redlineStart - min) / range);
      const a2 = startAngle + angleRange * ((redlineEnd - min) / range);
      ctx.beginPath();
      ctx.arc(cx, cy, r - 4, a1, a2);
      ctx.strokeStyle = 'rgba(255, 60, 60, 0.4)';
      ctx.lineWidth = 6;
      ctx.stroke();
    }

    const numTicks = 10;
    for (let i = 0; i <= numTicks; i++) {
      const angle = startAngle + (i / numTicks) * angleRange;
      const isMajor = i % 2 === 0;
      const tickLen = isMajor ? 14 : 7;
      const tx1 = cx + Math.cos(angle) * (r - 2);
      const ty1 = cy + Math.sin(angle) * (r - 2);
      const tx2 = cx + Math.cos(angle) * (r - 2 - tickLen);
      const ty2 = cy + Math.sin(angle) * (r - 2 - tickLen);
      
      ctx.beginPath();
      ctx.moveTo(tx1, ty1); 
      ctx.lineTo(tx2, ty2);
      ctx.strokeStyle = isMajor ? '#e1ece8' : '#6b7a80';
      ctx.lineWidth = isMajor ? 3 : 1.5;
      ctx.stroke();
    }

    ctx.fillStyle = '#adbfbb';
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; 
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= numTicks; i+=2) {
      const angle = startAngle + (i / numTicks) * angleRange;
      const tx = cx + Math.cos(angle) * (r - 32);
      const ty = cy + Math.sin(angle) * (r - 32);
      const label = Math.round(min + (i / numTicks) * range);
      ctx.fillText(label, tx, ty);
    }

    const currentVal = Math.min(Math.max(val, min), max);
    const needleAngle = startAngle + ((currentVal - min) / range) * angleRange;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(needleAngle);
    ctx.beginPath();
    ctx.moveTo(-8, 0); 
    ctx.lineTo(r - 18, 0);
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#1a2225';
    ctx.fill();
    ctx.strokeStyle = '#e1ece8';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4d4d';
    ctx.fill();
  }

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x9da8b5, 0.001);
  const camera = new THREE.PerspectiveCamera(76, innerWidth/innerHeight, .1, 4500);
  const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .96;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.setAttribute("aria-label","ฉากขับรถ 3 มิติ"); root.prepend(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xc5deeb,0x37402c,1.05); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffdfb2,2.6); sun.position.set(-180,320,-240); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-180; sun.shadow.camera.right=180; sun.shadow.camera.top=220; sun.shadow.camera.bottom=-180; sun.shadow.bias=-.00018; sun.shadow.normalBias=.025; scene.add(sun);
  const fill = new THREE.DirectionalLight(0xd7e3ed,.32); fill.position.set(150,70,100); scene.add(fill);

  function noiseTexture(base, fleck, size=512, density=17000) {
    const c=document.createElement("canvas");c.width=c.height=size;const g=c.getContext("2d");g.fillStyle=base;g.fillRect(0,0,size,size);
    for(let i=0;i<density;i++){g.globalAlpha=Math.random()*.14;g.fillStyle=Math.random()>.5?fleck:"#111719";const s=Math.random()*2+0.4;g.fillRect(Math.random()*size,Math.random()*size,s,s)}
    g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;
  }
  
  const asphaltFallback=noiseTexture("#1f2326","#5c6164",512,24000);
  asphaltFallback.wrapS=asphaltFallback.wrapT=THREE.RepeatWrapping;asphaltFallback.repeat.set(1,1);asphaltFallback.encoding=THREE.sRGBEncoding;
  
  const grassFallback=noiseTexture("#3b4246","#6e7579",512,18000);
  grassFallback.wrapS=grassFallback.wrapT=THREE.RepeatWrapping;grassFallback.repeat.set(80,220);grassFallback.encoding=THREE.sRGBEncoding;
  
  const roadMat=new THREE.MeshStandardMaterial({map:asphaltFallback,color:0xffffff,roughness:.92});
  const grassMat=new THREE.MeshStandardMaterial({map:grassFallback,color:0xffffff,roughness:1});
  
  const whiteMat=new THREE.MeshStandardMaterial({color:0xe6e1d1,roughness:.76});
  const yellowMat=new THREE.MeshStandardMaterial({color:0xe0bd72,roughness:.8});
  const barrierMat=new THREE.MeshStandardMaterial({color:0x9e9e9e,metalness:.1,roughness:.8});

  const skyCanvas=document.createElement("canvas");skyCanvas.width=1024;skyCanvas.height=512;const sg=skyCanvas.getContext("2d");
  const skyGrad=sg.createLinearGradient(0,0,0,512);skyGrad.addColorStop(0,"#3b4d61");skyGrad.addColorStop(.4,"#8b95a1");skyGrad.addColorStop(.7,"#d9b592");skyGrad.addColorStop(1,"#e8c8a8");sg.fillStyle=skyGrad;sg.fillRect(0,0,1024,512);
  for(let i=0;i<34;i++){const x=Math.random()*1024,y=60+Math.random()*210,r=18+Math.random()*70;const cloud=sg.createRadialGradient(x,y,1,x,y,r);cloud.addColorStop(0,"#f5e9d44a");cloud.addColorStop(1,"#f5e9d400");sg.fillStyle=cloud;sg.fillRect(x-r,y-r,r*2,r*2)}
  const skyTex=new THREE.CanvasTexture(skyCanvas);skyTex.mapping=THREE.EquirectangularReflectionMapping;skyTex.encoding=THREE.sRGBEncoding;scene.background=skyTex;scene.environment=skyTex;
  
  const world=new THREE.Group();scene.add(world);

  const roadLength=4200, roadWidth=24, segment=14;
  function centerX(z){return 0;}
  const groundLength=roadLength,groundOffset=-groundLength/2;
  
  function terrainHeight(x,z,cx){ return -0.5; }
  
  const terrainGeo=new THREE.PlaneGeometry(1800,groundLength,80,220);terrainGeo.rotateX(-Math.PI/2);
  const pos=terrainGeo.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i)+groundOffset;pos.setY(i,terrainHeight(x,z,centerX(z)))}
  terrainGeo.computeVertexNormals();const terrain=new THREE.Mesh(terrainGeo,grassMat);terrain.position.z=groundOffset;terrain.receiveShadow=true;world.add(terrain);
  
  const roadVerts=[],roadUvs=[],roadIdx=[];
  const segments=Math.ceil(roadLength/segment);
  for(let i=0;i<=segments;i++){
    const z=-i*segment,cx=centerX(z),prev=centerX(z-1),next=centerX(z+1),dx=next-prev,len=Math.hypot(dx,2),nx=2/len,nz=-dx/len;
    for(const side of [-1,1]){roadVerts.push(cx+nx*roadWidth*.5*side, .05,z+nz*roadWidth*.5*side);roadUvs.push(side===-1?0:6,i*segment/6)}
    if(i<segments){const a=i*2;roadIdx.push(a,a+1,a+2,a+1,a+3,a+2)}
  }
  const roadGeo=new THREE.BufferGeometry();roadGeo.setAttribute("position",new THREE.Float32BufferAttribute(roadVerts,3));roadGeo.setAttribute("uv",new THREE.Float32BufferAttribute(roadUvs,2));roadGeo.setIndex(roadIdx);roadGeo.computeVertexNormals();const road=new THREE.Mesh(roadGeo,roadMat);road.receiveShadow=true;world.add(road);

  function stripeMesh(z0,length,width,offset,material,y=.08){
    const verts=[],idx=[];const steps=Math.max(1,Math.ceil(length/4));
    for(let i=0;i<=steps;i++){const z=z0-i*(length/steps),cx=centerX(z),dx=centerX(z+1)-centerX(z-1),ll=Math.hypot(dx,2),nx=2/ll,nz=-dx/ll;for(const side of [-1,1])verts.push(cx+nx*(offset+side*width/2),y,z+nz*(offset+side*width/2));if(i<steps){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
    const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();const m=new THREE.Mesh(geo,material);m.receiveShadow=true;world.add(m);return m;
  }
  
  const roadEdgeLine=roadWidth*.5-.25;
  stripeMesh(0,roadLength, .15,-roadEdgeLine,whiteMat,.11);
  stripeMesh(0,roadLength, .15, roadEdgeLine,whiteMat,.11);

        }
        if(separatedParts){
          parent.add(steeringWheelRig);steeringWheelLogo.visible=false;
          const whiteLeather=new THREE.MeshStandardMaterial({color:0xf4f5f2,roughness:.32,metalness:.08});
          const whiteMetal=new THREE.MeshStandardMaterial({color:0xd8dfdf,roughness:.25,metalness:.48});
          const whiteHub=new THREE.MeshStandardMaterial({color:0xf9faf7,roughness:.24,metalness:.16});
          function addWhiteWheelPart(geometry,material,position,rotation){
            const part=new THREE.Mesh(geometry,material);part.position.set(...position);if(rotation)part.rotation.set(...rotation);part.castShadow=true;part.receiveShadow=true;steeringWheelRig.add(part);return part;
          }
          addWhiteWheelPart(new THREE.TorusGeometry(.175,.022,14,56),whiteLeather,[0,0,0]);
          addWhiteWheelPart(new THREE.TorusGeometry(.148,.004,8,48),whiteMetal,[0,0,-.004]);
          for(const angle of [Math.PI/2,Math.PI*7/6,Math.PI*11/6]){
            const spoke=addWhiteWheelPart(new THREE.BoxGeometry(.027,.125,.032),whiteMetal,[Math.cos(angle)*.102,Math.sin(angle)*.102,-.008]);
            spoke.rotation.z=angle-Math.PI/2;
          }
          addWhiteWheelPart(new THREE.CylinderGeometry(.052,.057,.04,32),whiteHub,[0,0,-.014],[Math.PI/2,0,0]);
          addWhiteWheelPart(new THREE.CylinderGeometry(.031,.031,.043,32),whiteMetal,[0,0,-.016],[Math.PI/2,0,0]);
          steeringWheelBase=steeringWheelRig.quaternion.clone();
        }else{steeringWheelRig=null;console.warn("Could not remove the original steering wheel from the interior mesh")}
      }
    }
    
    selectCar(0);
    applyCameraMode();
    spawnBots();
    message.querySelector("span").textContent="กด W หรือ ↑ เพื่อออกเดินทาง";
  },error=>{
    console.error("Could not load the car model",error);
    message.querySelector("span").textContent="โหลดโมเดล Porsche ไม่สำเร็จ ลองเปิดไฟล์ใหม่อีกครั้ง";
  });

  let speed=0,dist=0,offset=0,steer=0,worldZ=0,elapsed=0,last=performance.now(),toastTime=0,started=false,gear=1;
  let neutralRev=0;                 
  let boost = 0; 
  const neutralRevMax=7200;         
  const reverseMaxSpeed=60;
  const reverseAcceleration=30;
  
  function getMaxSpeed() { return currentCarSpec.maxSpeed || 710; }
  function getGearSpeed(g) { 
    if (g < 1) return currentCarSpec.maxSpeed || 710; 
    return currentCarSpec.gearSpeed[g] || currentCarSpec.maxSpeed || 710; 
  }
  function getGearAcceleration(g) { 
    if (g < 1) return 24; 
    return currentCarSpec.accel[g] || 24; 
  }

  function gearLabel(g){ return g===-1?"R":g===0?"N":String(g) }
  
  function changeGear(amount){
    const oldGear = gear;
    gear = THREE.MathUtils.clamp(gear + amount, -1, 6);
    if (gear !== 0) neutralRev = 0;      
    gearText.textContent = gearLabel(gear);

    if (oldGear > 0 && gear > 0 && gear < oldGear) {
      if (speed > 80) {
        spawnExhaustFlame(1.0 + Math.random() * 0.6);
        playExhaustPop(1.1);
        flameCooldown = 0.15;
        boost = Math.min(25, boost + 6);
      }
    }
  }
  document.querySelector("#gearDown").addEventListener("click",()=>changeGear(-1));
  document.querySelector("#gearUp").addEventListener("click",()=>changeGear(1));
  function showToast(){toast.classList.add("show");toastTime=1.1}

  function update(dt){
    const gas=held.has("ArrowUp")||held.has("w")||held.has("W");const brake=held.has("ArrowDown")||held.has("s")||held.has("S");
    const left=held.has("ArrowLeft")||held.has("a")||held.has("A");const right=held.has("ArrowRight")||held.has("d")||held.has("D");

    let targetBoost = 0;
    if (gear > 0) {
      if (gas) {
        const baseRpm = 900 + Math.min(1, speed/getGearSpeed(gear)) * 9100;
        const rpmRatio = baseRpm / 9000;
        const speedRatio = Math.abs(speed) / getMaxSpeed();
        targetBoost = (5 + rpmRatio * 10) + (speedRatio * 5);
      } else {
        targetBoost = -5; 
      }
    } else {
      targetBoost = -8;
    }

    const boostLerpSpeed = targetBoost > boost ? 6.0 : 2.5;
    boost += (targetBoost - boost) * Math.min(1, dt * boostLerpSpeed);
    boost = Math.max(-10, Math.min(25, boost));

    if (!Number.isFinite(boost)) boost = 0;

    const boostMultiplier = Math.max(1.0, 1.0 + (boost * 0.03));

    if(gear===-1){
      if(gas){
        started=true;
        if(speed>=-reverseMaxSpeed)speed=Math.max(-reverseMaxSpeed,speed-reverseAcceleration*dt);
      }else{
        speed=Math.min(0,speed+(brake?100:8)*dt);
      }
      if(brake&&speed<0)speed=Math.min(0,speed+83*dt);
      if(speed>0)speed=Math.max(0,speed-(brake?140:35)*dt);
    }else if(gear===0){
      if(brake)speed=Math.max(0,speed-83*dt);
      else speed=Math.max(0,speed-8*dt);
      if(speed<0)speed=Math.min(0,speed+83*dt);
      
      if(gas) neutralRev=Math.min(1,neutralRev+dt*3.2);
      else    neutralRev=Math.max(0,neutralRev-dt*1.8);

      const currentRpm=900+neutralRev*(neutralRevMax-900)+Math.abs(speed)*3;
      if(currentRpm>5500 && flameCooldown<=0){
        spawnExhaustFlame(0.8+Math.random()*0.5);
        playExhaustPop(0.85);
        flameCooldown=0.10;
        boost = Math.min(25, boost + 4);
      }
    }else{
      const gearOverspeed=Math.max(0,speed-getGearSpeed(gear));
      if(gearOverspeed>0)speed=Math.max(getGearSpeed(gear),speed-Math.min(72,gearOverspeed*1.8)*dt);
      
      if(gas){
        started=true;
        const finalAccel = getGearAcceleration(gear) * boostMultiplier;
        if(speed<getGearSpeed(gear)) speed=Math.min(getGearSpeed(gear),speed+finalAccel*dt);
      }else{
        speed=Math.max(0,speed-(brake?100:8)*dt);
      }
      if(brake)speed=Math.max(0,speed-83*dt);
    }
    setBrakeLights(brake);

    if (!Number.isFinite(speed)) speed = 0;

    if (!hasStartedMoving && speed > 5) {
      hasStartedMoving = true;
      carSelector.classList.add("hidden");
    }

    const steerInput=(right?1:0)-(left?1:0);steer+=(steerInput-steer)*Math.min(1,dt*5.5);
    const steerDir=speed<0?-1:1;
    
    offset+=steer*steerDir*dt*(1.6+Math.abs(speed)*.012);
    
    const roadHalfWidth=roadWidth*.5;
    const collisionBound = roadHalfWidth - 1.0; 
    
    if(Math.abs(offset)>collisionBound+.75){speed=Math.max(0,speed-65*dt);offset=THREE.MathUtils.clamp(offset,-collisionBound-1.4,collisionBound+1.4);if(Math.random()<dt*3)showToast()}
    if(Math.abs(offset)>collisionBound+1.4){offset=THREE.MathUtils.clamp(offset,-collisionBound-1.4,collisionBound+1.4)}
    
    const travel=speed/3.6*dt;dist+=Math.abs(travel)/1000;elapsed+=dt;
    wheelSpin=(wheelSpin+travel/.34)%(Math.PI*2);
    const axleAxis=new THREE.Vector3(1,0,0),steerAxis=new THREE.Vector3(0,1,0);
    for(const wheel of wheelAnimations){
      const spinRotation=new THREE.Quaternion().setFromAxisAngle(axleAxis,wheelSpin*wheel.side);
      if(wheel.front){
        const steeringRotation=new THREE.Quaternion().setFromAxisAngle(steerAxis,-steer*.42);
        wheel.object.quaternion.copy(wheel.base).multiply(steeringRotation).multiply(spinRotation);
      }else wheel.object.quaternion.copy(wheel.base).multiply(spinRotation);
    }
    if(steeringWheelRig&&steeringWheelBase){
      const handRotation=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),steer*1.55);
      steeringWheelRig.quaternion.copy(steeringWheelBase).multiply(handRotation);
    }
    worldZ-=travel;
    
    playerRig.position.set(offset,.18,worldZ);
    playerRig.rotation.y=Math.PI - steer*steerDir*.045;
    
    if(cameraMode==="chase")updateChaseCamera();else camera.rotation.z=-steer*.018;
    if(worldZ < -roadLength){
      worldZ+=roadLength;
      playerRig.position.z=worldZ;
      for(const section of trackSections)section.position.z+=roadLength;
      const sectionBehind=trackSections.find(section=>section.position.z>worldZ+roadLength/2);
      if(sectionBehind)sectionBehind.position.z=-roadLength;
    }
    
    let rpm;
    if(gear===-1) {
      rpm=Math.round(900+Math.abs(speed)/reverseMaxSpeed*4200);
    } else if(gear===0) {
      rpm=Math.round(900+neutralRev*(neutralRevMax-900)+Math.abs(speed)*3);
    } else {
      const boostRpmBonus = Math.max(0, boost) * 80; 
      rpm=Math.round(900+Math.min(1,speed/getGearSpeed(gear))*9100 + boostRpmBonus);
    }
    rpm = Math.min(10000, rpm);
    if (!Number.isFinite(rpm)) rpm = 900;

    if (gear > 0 && gas && boost > 15 && flameCooldown <= 0) {
      spawnExhaustFlame(0.6 + Math.random() * 0.4);
      playExhaustPop(0.7);
      flameCooldown = 0.15;
    }
    
    boostText.textContent = boost.toFixed(1);
    if (boost > 18) {
      boostGaugeBox.classList.add("overboost");
    } else {
      boostGaugeBox.classList.remove("overboost");
    }

    if(audioContext&&engineOscillator&&engineHarmonic&&engineFilter&&engineGain&&audioContext.currentTime-lastEngineAudioUpdate>.045){
      const now=audioContext.currentTime;
      
      const safeRpm = Number.isFinite(rpm) ? rpm : 900;
      const safeSpeed = Number.isFinite(speed) ? speed : 0;
      const safeGas = gas ? 1 : 0;
      const safeRevFactor = Number.isFinite(neutralRev) ? neutralRev : 0;

      const firingHz = safeRpm / 42;
      engineOscillator.frequency.setTargetAtTime(firingHz, now, .045);
      engineHarmonic.frequency.setTargetAtTime(firingHz * .5, now, .045);
      
      const filterFreq = 380 + safeGas * 1500 + safeRevFactor * 900 + Math.abs(safeSpeed) / getMaxSpeed() * 520;
      engineFilter.frequency.setTargetAtTime(filterFreq, now, .08);
      
      const gainVal = started ? .018 + safeGas * .04 + safeRevFactor * .034 + Math.abs(safeSpeed) / getMaxSpeed() * .01 : .0001;
      engineGain.gain.setTargetAtTime(gainVal, now, .09);
      
      lastEngineAudioUpdate = now;
    }
    
    speedText.textContent=String(Math.round(speed));
    rpmText.textContent=(rpm/1000).toFixed(1); 
    distanceText.textContent=dist.toFixed(2);
    gearText.textContent=gearLabel(gear);
    
    drawGauge(ctxSpeed, speed, -50, getMaxSpeed(), getMaxSpeed()*0.8, getMaxSpeed());
    drawGauge(ctxRpm, rpm, 0, 10000, 8000, 10000);
    drawGauge(ctxBoost, boost, -10, 25, 18, 25);

    // ===== อัปเดตรถบอท + collision =====
    for(const bot of botCars){
      bot.z -= (bot.speed/3.6) * dt;

      if (bot.z > worldZ + 120){
        respawnBot(bot);
      }

      bot.mesh.position.z = bot.z;
      bot.mesh.position.x = bot.lane;
      bot.mesh.rotation.y = Math.PI + Math.sin(elapsed*.7 + bot.z*.05)*.004;

      const dz = bot.z - worldZ;
      const dx = bot.lane - offset;
      const overlapZ = BOT_COLLISION_DZ + PLAYER_HALF_DZ - Math.abs(dz);
      const overlapX = BOT_COLLISION_DX + PLAYER_HALF_DX - Math.abs(dx);

      if (overlapZ > 0 && overlapX > 0){
        if (overlapZ < overlapX){
          const dir = dz > 0 ? -1 : 1;
          worldZ -= dir * overlapZ;
          speed = Math.max(0, speed - 120*dt);
          if (speed > 0) speed *= 0.5;
        } else {
          const dir = dx > 0 ? -1 : 1;
          offset += dir * overlapX;
          speed = Math.max(0, speed - 80*dt);
        }
        if (Math.random() < dt*4) showToast();
      }
    }

    updateExhaustFlames(dt);

    message.classList.toggle("hide",started&&!!playerCar);if(toastTime>0){toastTime-=dt;if(toastTime<=0)toast.classList.remove("show")}
  }
  function draw(){renderer.render(scene,camera)}
  function animate(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(animate)}
  requestAnimationFrame(animate);
  function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight)}
  addEventListener("resize",resize);

  document.addEventListener("contextmenu",e=>e.preventDefault());
  document.addEventListener("gesturestart",e=>e.preventDefault());
  let lastTouchEnd=0;
  document.addEventListener("touchend",e=>{const n=Date.now();if(n-lastTouchEnd<300)e.preventDefault();lastTouchEnd=n},{passive:false});
  addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();held.add(e.key);if(e.key.toLowerCase()==="w"||e.key==="ArrowUp")startEngineAudio();if(!e.repeat&&e.key.toLowerCase()==="e")changeGear(1);if(!e.repeat&&e.key.toLowerCase()==="q")changeGear(-1);if(e.key.toLowerCase()==="c"){cameraMode=cameraMode==="driver"?"chase":"driver";applyCameraMode()}if(e.key.toLowerCase()==="r")location.reload()});
  addEventListener("keyup",e=>held.delete(e.key));addEventListener("blur",()=>held.clear());
  document.querySelectorAll(".touch").forEach(button=>{const key=button.dataset.key;button.addEventListener("pointerdown",e=>{e.preventDefault();held.add(key);if(key==="w"||key==="ArrowUp")startEngineAudio();button.setPointerCapture(e.pointerId)});for(const name of ["pointerup","pointercancel","lostpointercapture"])button.addEventListener(name,()=>held.delete(key))});
})();
</script>
</body>
</html>
