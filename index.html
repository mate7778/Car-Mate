<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Evening Drive — 3D First Person</title>
  <style>
    :root{color-scheme:dark;--ice:#d9eee9;--muted:#a8b6b5;--glass:#0810159c}
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;background:#111820;color:#f5f7f5;
      font-family:"Segoe UI",Tahoma,sans-serif;
      -webkit-tap-highlight-color:transparent;
      user-select:none;-webkit-user-select:none;
      overscroll-behavior:none;
    }
    #game{position:relative;width:100%;height:100%;overflow:hidden;background:#252d31}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;position:relative;z-index:0}
    canvas:active{cursor:grabbing}
    .top{position:absolute;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px;background:linear-gradient(#071015a8,transparent);pointer-events:none;z-index:10}
    .brand{font-size:.7rem;letter-spacing:.2em;font-weight:800;color:#e1ece8;text-shadow:0 1px 8px #000}.brand small{display:block;margin-top:5px;color:#bacac5;font-size:.58rem;font-weight:500;letter-spacing:.13em}
    .stats{display:flex;gap:8px}.stat{min-width:91px;padding:8px 11px;border:1px solid #ffffff25;border-radius:10px;background:#0710158a;backdrop-filter:blur(9px);text-align:center;box-shadow:0 5px 20px #0002}.stat span{display:block;color:#adbfbb;font-size:.58rem;letter-spacing:.14em}.stat strong{display:block;margin-top:3px;font-size:1rem;font-weight:650;font-variant-numeric:tabular-nums}.stat small{display:block;margin-top:2px;color:#b8c5c3;font-size:.55rem;letter-spacing:.08em;font-variant-numeric:tabular-nums}
    .gear-control{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;pointer-events:auto}.gear-control strong{min-width:14px;margin:0}.gear-control button{width:44px;height:44px;padding:0;border:1px solid #ffffff35;border-radius:8px;background:#ffffff18;color:#fff;font:700 1.05rem "Segoe UI",sans-serif;cursor:pointer;touch-action:manipulation}.gear-control button:hover{background:#ffffff38}.gear-control button:active{background:#ffffff55}
    .instructions{position:absolute;left:20px;top:82px;padding:10px 13px;border:1px solid #ffffff20;border-radius:10px;background:#07101578;color:#d1ddda;font-size:.72rem;line-height:1.65;backdrop-filter:blur(8px);pointer-events:none;z-index:10}.instructions b{color:white;font-weight:650}
    .camera-toggle{position:absolute;top:88px;right:22px;padding:10px 15px;border:1px solid #ffffff45;border-radius:10px;background:#071015b8;color:#f5f7f5;font:600 .75rem "Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(9px);box-shadow:0 5px 18px #0002;z-index:10;touch-action:manipulation}.camera-toggle:hover{background:#17302ecc}.camera-toggle:active{background:#2a4a46}
    .message{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 2px 16px #000;transition:opacity .5s;pointer-events:none;z-index:10}.message strong{display:block;font-size:clamp(1.5rem,4vw,3.2rem);font-weight:600;letter-spacing:.15em}.message span{display:block;margin-top:9px;color:#e0e8e4;font-size:.85rem;letter-spacing:.06em}.message.hide{opacity:0}
    .mobile{display:none;position:absolute;inset:auto 16px 18px;justify-content:space-between;align-items:end;pointer-events:none;z-index:20}.pad,.pedals{display:flex;gap:10px;pointer-events:auto}.touch{display:grid;place-items:center;width:60px;height:60px;border:1px solid #ffffff4a;border-radius:50%;background:#101b1dbd;color:#fff;font-size:1.35rem;user-select:none;touch-action:none;backdrop-filter:blur(8px)}.touch:active{background:#8bac9e88}.pedals .touch{width:54px;height:74px;border-radius:17px;font-size:.72rem;font-weight:750;letter-spacing:.08em}.pedals .go{border-color:#f5c47b88;background:#754a2699}.pedals .stop{border-color:#ec929288;background:#6e292999}
    .toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);padding:10px 16px;border:1px solid #ffdbb744;border-radius:9px;background:#241811a8;color:#ffe4be;font-size:.83rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:15}.toast.show{opacity:1}
    .credit{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#edf2eea8;font-size:.6rem;letter-spacing:.15em;text-shadow:0 1px 8px #000;pointer-events:none;white-space:nowrap;z-index:10}

    /* ===== มือถือ/แท็บเล็ต (ทุกทิศทาง) — pointer/hover detection ===== */
    @media (pointer: coarse), (hover: none) {
      .mobile { display: flex; }
      .instructions { top: auto; bottom: 120px; left: 14px; font-size: .66rem; }
      .camera-toggle { top: 76px; right: 13px; padding: 9px 12px; }
      .stat { min-width: 68px; padding: 7px; }
      .top { padding: 13px; }
      .brand { font-size: .62rem; }
      .stat span { font-size: .52rem; }
      .stat strong { font-size: .88rem; }
      .credit { display: none; }
    }

    /* ===== มือถือแนวนอน / จอเตี้ย ===== */
    @media (pointer: coarse) and (max-height: 500px) {
      .top { padding: 8px 12px; }
      .brand { font-size: .58rem; }
      .brand small { font-size: .5rem; }
      .stat { min-width: 58px; padding: 5px 8px; }
      .stat strong { font-size: .78rem; }
      .stat span { font-size: .48rem; }
      .stat small { font-size: .48rem; }
      .instructions { bottom: 96px; left: 10px; padding: 6px 9px; font-size: .6rem; line-height: 1.5; max-width: 170px; }
      .camera-toggle { top: 60px; right: 10px; padding: 7px 10px; font-size: .68rem; }
      .gear-control button { width: 34px; height: 34px; font-size: .9rem; }
      .mobile { inset: auto 10px 10px; }
      .touch { width: 52px; height: 52px; }
      .pedals .touch { width: 46px; height: 62px; }
      .message strong { font-size: 1.2rem; }
      .message span { font-size: .72rem; }
    }

    /* ===== จอแคบมาก (มือถือแนวตั้งจิ๋ว) ===== */
    @media (max-width: 390px) and (pointer: coarse) {
      .instructions { max-width: 175px; bottom: 108px; }
      .mobile { inset: auto 11px 13px; }
      .touch { width: 54px; height: 54px; }
      .pedals .touch { width: 47px; height: 67px; }
      .stats { gap: 4px; }
    }
  </style>
</head>
<body>
<main id="game">
  <div class="top"><div class="brand">EVENING DRIVE<small>OPEN ROAD · FIRST PERSON</small></div>
    <div class="stats"><div class="stat"><span>SPEED</span><strong><b id="speed">000</b> km/h</strong><small id="rpm">RPM 0900</small></div><div class="stat"><span>GEAR</span><div class="gear-control"><button id="gearDown" type="button" aria-label="ลดเกียร์">−</button><strong id="gear">1</strong><button id="gearUp" type="button" aria-label="เพิ่มเกียร์">+</button></div></div><div class="stat"><span>DISTANCE</span><strong><b id="distance">0.00</b> km</strong></div></div>
  </div>
  <div class="instructions"><b>ขับรถ</b><br>W / ↑ เร่ง · S / ↓ เบรก<br>A D / ← → เลี้ยว · Q / E เปลี่ยนเกียร์<br><span id="cameraHint">C สลับมุม · R เริ่มใหม่</span></div>
  <button id="cameraToggle" class="camera-toggle" type="button" aria-label="สลับมุมกล้อง">มุมมอง: คนขับ</button>
  <div id="message" class="message"><strong>EVENING DRIVE</strong><span>กำลังโหลดรถ 3 มิติ…</span></div>
  <div id="toast" class="toast">ชนขอบทาง ลดความเร็วลง</div>
  <div class="mobile"><div class="pad"><button class="touch" data-key="ArrowLeft" aria-label="เลี้ยวซ้าย">‹</button><button class="touch" data-key="ArrowRight" aria-label="เลี้ยวขวา">›</button></div><div class="pedals"><button class="touch stop" data-key="ArrowDown">เบรก</button><button class="touch go" data-key="ArrowUp">เร่ง</button></div></div>
  <div class="credit">A QUIET ROAD · TAKE IT EASY</div>
</main>
<script src="./three.min.js"></script>
<script src="./GLTFLoader.js"></script>
<script src="./porsche-data.js"></script>
<script>
(() => {
  const THREE = window.THREE;
  const root = document.querySelector("#game");
  const speedText = document.querySelector("#speed"), distanceText = document.querySelector("#distance"), gearText = document.querySelector("#gear"), rpmText=document.querySelector("#rpm");
  const message = document.querySelector("#message"), toast = document.querySelector("#toast");
  const held = new Set();
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xc9c8bb, 0.00125);
  const camera = new THREE.PerspectiveCamera(76, innerWidth/innerHeight, .1, 4500);
  const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .96;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.setAttribute("aria-label","ฉากขับรถ 3 มิติ"); root.prepend(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xc5deeb,0x37402c,1.05); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffdfb2,2.6); sun.position.set(-180,320,-240); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-180; sun.shadow.camera.right=180; sun.shadow.camera.top=220; sun.shadow.camera.bottom=-180; sun.shadow.bias=-.00018; sun.shadow.normalBias=.025; scene.add(sun);
  const fill = new THREE.DirectionalLight(0xd7e3ed,.32); fill.position.set(150,70,100); scene.add(fill);

  function noiseTexture(base, fleck, size=512, density=17000) {
    const c=document.createElement("canvas");c.width=c.height=size;const g=c.getContext("2d");g.fillStyle=base;g.fillRect(0,0,size,size);
    for(let i=0;i<density;i++){g.globalAlpha=Math.random()*.14;g.fillStyle=Math.random()>.5?fleck:"#111719";const s=Math.random()*2+0.4;g.fillRect(Math.random()*size,Math.random()*size,s,s)}
    g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;
  }
  const textureLoader=new THREE.TextureLoader();
  const asphaltFallback=noiseTexture("#292e30","#777a75",512,24000);asphaltFallback.wrapS=asphaltFallback.wrapT=THREE.RepeatWrapping;asphaltFallback.repeat.set(1,1);asphaltFallback.encoding=THREE.sRGBEncoding;
  const grassFallback=noiseTexture("#34432f","#829052",512,18000);grassFallback.wrapS=grassFallback.wrapT=THREE.RepeatWrapping;grassFallback.repeat.set(80,220);grassFallback.encoding=THREE.sRGBEncoding;
  const roadMat=new THREE.MeshStandardMaterial({map:asphaltFallback,color:0xffffff,roughness:.96});
  const grassMat=new THREE.MeshStandardMaterial({map:grassFallback,color:0xffffff,roughness:1});
  function swapTexture(path,repeat,apply,color=false){textureLoader.load(path,texture=>{texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.repeat.copy(repeat);texture.anisotropy=8;if(color)texture.encoding=THREE.sRGBEncoding;apply(texture)},undefined,()=>{});}
  swapTexture("./assets/asphalt-diff.jpg",new THREE.Vector2(1,1),texture=>{roadMat.map=texture;roadMat.needsUpdate=true},true);
  swapTexture("./assets/asphalt-normal.jpg",new THREE.Vector2(1,1),texture=>{roadMat.normalMap=texture;roadMat.normalScale.set(.24,.24);roadMat.needsUpdate=true});
  swapTexture("./assets/asphalt-rough.jpg",new THREE.Vector2(1,1),texture=>{roadMat.roughnessMap=texture;roadMat.needsUpdate=true});
  swapTexture("./assets/grass-diff.jpg",new THREE.Vector2(80,220),texture=>{grassMat.map=texture;grassMat.needsUpdate=true},true);
  const whiteMat=new THREE.MeshStandardMaterial({color:0xe6e1d1,roughness:.76});
  const yellowMat=new THREE.MeshStandardMaterial({color:0xe0bd72,roughness:.8});
  const railMat=new THREE.MeshStandardMaterial({color:0x8a8b82,metalness:.55,roughness:.47});

  const skyCanvas=document.createElement("canvas");skyCanvas.width=1024;skyCanvas.height=512;const sg=skyCanvas.getContext("2d");
  const skyGrad=sg.createLinearGradient(0,0,0,512);skyGrad.addColorStop(0,"#526e88");skyGrad.addColorStop(.48,"#b2b4ac");skyGrad.addColorStop(.78,"#e5bd99");skyGrad.addColorStop(1,"#dfb48b");sg.fillStyle=skyGrad;sg.fillRect(0,0,1024,512);
  for(let i=0;i<34;i++){const x=Math.random()*1024,y=60+Math.random()*210,r=18+Math.random()*70;const cloud=sg.createRadialGradient(x,y,1,x,y,r);cloud.addColorStop(0,"#f5e9d44a");cloud.addColorStop(1,"#f5e9d400");sg.fillStyle=cloud;sg.fillRect(x-r,y-r,r*2,r*2)}
  const skyTex=new THREE.CanvasTexture(skyCanvas);skyTex.mapping=THREE.EquirectangularReflectionMapping;skyTex.encoding=THREE.sRGBEncoding;scene.background=skyTex;scene.environment=skyTex;
  textureLoader.load("./assets/autumn-road-panorama.jpg",panorama=>{panorama.mapping=THREE.EquirectangularReflectionMapping;panorama.encoding=THREE.sRGBEncoding;panorama.magFilter=THREE.LinearFilter;panorama.minFilter=THREE.LinearMipmapLinearFilter;scene.background=panorama;scene.environment=panorama},undefined,error=>console.error("Could not load the panorama",error));
  const world=new THREE.Group();scene.add(world);

  const roadLength=4200, roadWidth=14, segment=14;
  function centerX(z){return 24*Math.sin(z*Math.PI*4/roadLength)+8*Math.sin(z*Math.PI*10/roadLength+1.2)}
  const groundLength=roadLength,groundOffset=-groundLength/2;
  function terrainHeight(x,z,cx){
    const distance=Math.abs(x-cx);
    const foothills=THREE.MathUtils.smoothstep(distance,58,250);
    const ridge=25+19*Math.sin(z*.0028+x*.0021)+12*Math.sin(z*.0065-x*.0047)+7*Math.sin(x*.014+z*.011);
    const rolling=Math.sin(z*.008+x*.004)*.45+Math.sin(z*.002-x*.002)*.7;
    return -.24+foothills*(Math.max(3,ridge)+rolling);
  }
  const terrainGeo=new THREE.PlaneGeometry(1800,groundLength,80,220);terrainGeo.rotateX(-Math.PI/2);
  const pos=terrainGeo.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i)+groundOffset;pos.setY(i,terrainHeight(x,z,centerX(z)))}
  terrainGeo.computeVertexNormals();const terrain=new THREE.Mesh(terrainGeo,grassMat);terrain.position.z=groundOffset;terrain.receiveShadow=true;world.add(terrain);
  const roadVerts=[],roadUvs=[],roadIdx=[],shoulderVerts=[],shoulderIdx=[];
  const segments=Math.ceil(roadLength/segment);
  for(let i=0;i<=segments;i++){
    const z=-i*segment,cx=centerX(z),prev=centerX(z-1),next=centerX(z+1),dx=next-prev,len=Math.hypot(dx,2),nx=2/len,nz=-dx/len;
    for(const side of [-1,1]){roadVerts.push(cx+nx*roadWidth*.5*side, .05,z+nz*roadWidth*.5*side);roadUvs.push(side===-1?0:6,i*segment/6)}
    if(i<segments){const a=i*2;roadIdx.push(a,a+1,a+2,a+1,a+3,a+2)}
  }
  const roadGeo=new THREE.BufferGeometry();roadGeo.setAttribute("position",new THREE.Float32BufferAttribute(roadVerts,3));roadGeo.setAttribute("uv",new THREE.Float32BufferAttribute(roadUvs,2));roadGeo.setIndex(roadIdx);roadGeo.computeVertexNormals();const road=new THREE.Mesh(roadGeo,roadMat);road.receiveShadow=true;world.add(road);

  function stripeMesh(z0,length,width,offset,material,y=.08){
    const verts=[],idx=[];const steps=Math.max(1,Math.ceil(length/4));
    for(let i=0;i<=steps;i++){const z=z0-i*(length/steps),cx=centerX(z),dx=centerX(z+1)-centerX(z-1),ll=Math.hypot(dx,2),nx=2/ll,nz=-dx/ll;for(const side of [-1,1])verts.push(cx+nx*(offset+side*width/2),y,z+nz*(offset+side*width/2));if(i<steps){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
    const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();const m=new THREE.Mesh(geo,material);m.receiveShadow=true;world.add(m);return m;
  }
  const roadEdgeLine=roadWidth*.5-.25;
  stripeMesh(0,roadLength, .14,-roadEdgeLine,whiteMat,.11);stripeMesh(0,roadLength,.14,roadEdgeLine,whiteMat,.11);
  stripeMesh(0,roadLength,.12,0,yellowMat,.105);
  stripeMesh(0,roadLength,.11,-(roadEdgeLine-.45),whiteMat,.11);stripeMesh(0,roadLength,.11,roadEdgeLine-.45,whiteMat,.11);
  const dashes=[];for(let z=-14;z>-roadLength;z-=68){const dash=stripeMesh(z,23,.13,0,whiteMat,.115);dashes.push({mesh:dash,z})}

  function addInstancedRoadside(geometry,material,records,withColors=false){
    const mesh=new THREE.InstancedMesh(geometry,material,records.length),dummy=new THREE.Object3D();
    for(let i=0;i<records.length;i++){
      const item=records[i];dummy.position.set(item.x,item.y,item.z);dummy.rotation.set(item.rx||0,item.ry||0,item.rz||0);dummy.scale.set(item.sx||1,item.sy||1,item.sz||1);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);
      if(withColors&&item.color)mesh.setColorAt(i,item.color);
    }
    mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;mesh.castShadow=false;mesh.receiveShadow=true;world.add(mesh);return mesh;
  }
  const railBeamRecords=[],railPostRecords=[],reflectorRecords=[];
  const railSpacing=7,railCount=Math.ceil(roadLength/railSpacing);
  for(let i=0;i<railCount;i++){
    const z=-i*railSpacing-railSpacing*.5,cx=centerX(z),dx=centerX(z-1)-centerX(z+1),len=Math.hypot(dx,2),nx=2/len,nz=dx/len,angle=Math.atan2(-dx,2);
    for(const side of [-1,1]){
      const x=cx+nx*(roadWidth*.5+1.8)*side,rz=z+nz*(roadWidth*.5+1.8)*side;
      railBeamRecords.push({x,y:.94,z:rz,ry:angle,sx:1,sy:1,sz:railSpacing+.25});
      if(i%2===0)railPostRecords.push({x,y:.42,z:rz,ry:angle,sx:1,sy:1.25,sz:1});
      if(i%4===0)reflectorRecords.push({x:x-side*.045,y:1.04,z:rz,ry:angle,sx:1,sy:1,sz:1,color:new THREE.Color().setHSL(.12,.22,.72)});
    }
  }
  addInstancedRoadside(new THREE.BoxGeometry(.13,.18,1),railMat,railBeamRecords);
  addInstancedRoadside(new THREE.BoxGeometry(.10,.72,.10),railMat,railPostRecords);
  addInstancedRoadside(new THREE.BoxGeometry(.035,.14,.045),new THREE.MeshStandardMaterial({color:0xf1e5c7,emissive:0x34291b,roughness:.38}),reflectorRecords);

  const treeRecords=[],trunkRecords=[];
  let seed=39107;function random01(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
  for(let z=-24;z>-roadLength;z-=27){
    for(const side of [-1,1]){
      const treeZ=z-random01()*10,roadX=centerX(treeZ),offset=roadWidth*.5+17+random01()*72,x=roadX+side*offset;
      const groundY=terrainHeight(x,treeZ,roadX),height=9+random01()*12,radius=2.8+random01()*2.8;
      const tint=new THREE.Color().setHSL(.25+random01()*.07,.30+random01()*.20,.19+random01()*.10);
      treeRecords.push({x,y:groundY+height*.56,z:treeZ,sx:radius,sy:height*.88,sz:radius,rx:(random01()-.5)*.08,rz:(random01()-.5)*.08,color:tint});
      const trunkHeight=height*.32;trunkRecords.push({x,y:groundY+trunkHeight*.5,z:treeZ,sx:.16+radius*.045,sy:trunkHeight,sz:.16+radius*.045,color:new THREE.Color(0x594839)});
    }
  }
  for(let z=-38;z>-roadLength;z-=46){
    for(const side of [-1,1]){
      const treeZ=z-random01()*18,roadX=centerX(treeZ),offset=105+random01()*150,x=roadX+side*offset;
      const groundY=terrainHeight(x,treeZ,roadX),height=14+random01()*20,radius=4+random01()*5;
      const tint=new THREE.Color().setHSL(.25+random01()*.08,.28+random01()*.18,.17+random01()*.10);
      treeRecords.push({x,y:groundY+height*.56,z:treeZ,sx:radius,sy:height*.88,sz:radius,rx:(random01()-.5)*.08,rz:(random01()-.5)*.08,color:tint});
      const trunkHeight=height*.32;trunkRecords.push({x,y:groundY+trunkHeight*.5,z:treeZ,sx:.19+radius*.04,sy:trunkHeight,sz:.19+radius*.04,color:new THREE.Color(0x554536)});
    }
  }
  const treeMaterial=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1});
  addInstancedRoadside(new THREE.ConeGeometry(1,1,9,2),treeMaterial,treeRecords,true);
  addInstancedRoadside(new THREE.CylinderGeometry(.75,.95,1,7),new THREE.MeshStandardMaterial({color:0xffffff,roughness:1}),trunkRecords,true);

  const trackA=world;
  const trackB=world.clone(true);
  trackB.position.z=-roadLength;
  scene.add(trackB);
  const trackSections=[trackA,trackB];

  camera.rotation.order="YXZ";
  const playerRig=new THREE.Group();scene.add(playerRig);
  let cameraMode="driver",playerCar=null,orbitYaw=0,orbitPitch=.18,orbitDistance=6.8,orbitDrag=null;
  let wheelSpin=0,wheelAnimations=[],steeringWheelRig=null,steeringWheelBase=null,steeringWheelLogo=null;
  const brakeLightMaterials=[],brakePointLights=[];
  let brakeState=false,audioContext=null,engineOscillator=null,engineHarmonic=null,engineFilter=null,engineGain=null,lastEngineAudioUpdate=0;
  function startEngineAudio(){
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;
    if(!audioContext){
      try{
        audioContext=new AudioContextClass();
        engineFilter=audioContext.createBiquadFilter();engineFilter.type="lowpass";engineFilter.frequency.value=650;engineFilter.Q.value=.8;
        engineGain=audioContext.createGain();engineGain.gain.value=.0001;engineFilter.connect(engineGain);engineGain.connect(audioContext.destination);
        engineOscillator=audioContext.createOscillator();engineOscillator.type="sawtooth";engineOscillator.frequency.value=48;engineOscillator.connect(engineFilter);engineOscillator.start();
        engineHarmonic=audioContext.createOscillator();engineHarmonic.type="triangle";engineHarmonic.frequency.value=96;
        const harmonicGain=audioContext.createGain();harmonicGain.gain.value=.19;engineHarmonic.connect(harmonicGain);harmonicGain.connect(engineFilter);engineHarmonic.start();
      }catch(error){console.warn("Engine audio is unavailable",error);audioContext=null;return}
    }
    if(audioContext.state==="suspended")audioContext.resume().catch(()=>{});
  }
  function setBrakeLights(on){
    if(brakeState===on)return;
    brakeState=on;
    brakeLightMaterials.forEach(({material,emissive,intensity})=>{
      if(on){material.emissive.set(0xff170b);material.emissiveIntensity=Math.max(2.2,intensity)}
      else{material.emissive.copy(emissive);material.emissiveIntensity=intensity}
    });
    brakePointLights.forEach(light=>{light.intensity=on?2.5:0});
  }
  const driverHiddenParts=[];
  const cameraToggle=document.querySelector("#cameraToggle");
  const cameraHint=document.querySelector("#cameraHint");
  function updateChaseCamera(){
    const cp=Math.cos(orbitPitch),sp=Math.sin(orbitPitch);
    camera.position.set(Math.sin(orbitYaw)*orbitDistance*cp,.72+sp*orbitDistance,-Math.cos(orbitYaw)*orbitDistance*cp);
    camera.lookAt(playerRig.localToWorld(new THREE.Vector3(0,.72,0)));
  }
  function applyCameraMode(){
    const driver=cameraMode==="driver";
    camera.fov=driver?76:58;camera.updateProjectionMatrix();
    if(driver){camera.position.set(.38,1.02,-.38);camera.rotation.set(0,Math.PI,0)}else updateChaseCamera();
    cameraToggle.textContent=driver?"มุมมอง: คนขับ":"มุมมอง: รอบรถ";
    cameraToggle.setAttribute("aria-label",driver?"เปลี่ยนเป็นมุมมองรอบรถ":"เปลี่ยนเป็นมุมมองคนขับ");
    cameraHint.textContent=driver?"C สลับมุม · R เริ่มใหม่":"ลากเมาส์/นิ้วเพื่อหมุน · ล้อเมาส์ซูม";
    driverHiddenParts.forEach(part=>part.visible=!driver);
  }
  playerRig.add(camera);
  cameraToggle.addEventListener("click",()=>{cameraMode=cameraMode==="driver"?"chase":"driver";applyCameraMode()});
  renderer.domElement.addEventListener("pointerdown",e=>{
    if(cameraMode!=="chase"||e.button!==0)return;
    orbitDrag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);e.preventDefault();
  });
  renderer.domElement.addEventListener("pointermove",e=>{
    if(!orbitDrag||e.pointerId!==orbitDrag.id)return;
    const dx=e.clientX-orbitDrag.x,dy=e.clientY-orbitDrag.y;orbitDrag.x=e.clientX;orbitDrag.y=e.clientY;
    orbitYaw-=dx*.005;orbitPitch=THREE.MathUtils.clamp(orbitPitch-dy*.004,-.12,.9);updateChaseCamera();
  });
  function endOrbitDrag(e){if(orbitDrag&&e.pointerId===orbitDrag.id)orbitDrag=null}
  renderer.domElement.addEventListener("pointerup",endOrbitDrag);renderer.domElement.addEventListener("pointercancel",endOrbitDrag);renderer.domElement.addEventListener("lostpointercapture",endOrbitDrag);
  renderer.domElement.addEventListener("wheel",e=>{if(cameraMode!=="chase")return;e.preventDefault();orbitDistance=THREE.MathUtils.clamp(orbitDistance+Math.sign(e.deltaY)*.45,3.2,12);updateChaseCamera()},{passive:false});
  applyCameraMode();
  let vehicleTemplate=null;
  const vehicleLoader=new THREE.GLTFLoader();
  const porscheBinary=Uint8Array.from(atob(window.PORSCHE_GLB_DATA),ch=>ch.charCodeAt(0)).buffer;
  vehicleLoader.parse(porscheBinary,"",gltf=>{
    vehicleTemplate=gltf.scene;
    vehicleTemplate.traverse(object=>{if(object.isMesh){object.castShadow=true;object.receiveShadow=true}});
    playerCar=vehicleTemplate.clone(true);playerRig.add(playerCar);
    playerCar.traverse(object=>{
      if(/Main_body|Body_Paint|Tire|(?:RL|FL|FR|RR)_wheel|Fender|Mirror|Hood|Bonnet|Wing|Spoiler|bumper|Headlight|Taillight|Windshield|Windows|Window_circuit|Sunroof|glass|Exhaust|Blinker/i.test(object.name)){
        driverHiddenParts.push(object);object.visible=false;
      }
      if(object.isMesh){
        const materials=Array.isArray(object.material)?object.material:[object.material];
        materials.forEach(material=>{material.envMapIntensity=1.35;if(material.name.includes("Main")&&"roughness" in material)material.roughness=Math.min(material.roughness,.22);if("clearcoat" in material){material.clearcoat=Math.max(material.clearcoat,.55);material.clearcoatRoughness=Math.min(material.clearcoatRoughness,.12)}material.needsUpdate=true});
      }
      if(object.isMesh&&/Taillights_glass_Taillights_glass_0/i.test(object.name)){
        const originals=Array.isArray(object.material)?object.material:[object.material];
        const cloned=originals.map(original=>{
          const material=original.clone();
          if(!material.emissive)material.emissive=new THREE.Color(0x000000);
          brakeLightMaterials.push({material,emissive:material.emissive.clone(),intensity:material.emissiveIntensity??1});
          return material;
        });
        object.material=Array.isArray(object.material)?cloned:cloned[0];
      }
    });
    const tailGroup=playerCar.getObjectByName("Taillights");
    if(tailGroup){
      playerCar.updateWorldMatrix(true,true);
      const tailBounds=new THREE.Box3().setFromObject(tailGroup).applyMatrix4(playerCar.matrixWorld.clone().invert());
      if(!tailBounds.isEmpty()){
        const xMid=(tailBounds.min.x+tailBounds.max.x)*.5,yMid=(tailBounds.min.y+tailBounds.max.y)*.5;
        const xOffset=Math.max(.38,(tailBounds.max.x-tailBounds.min.x)*.34),rearZ=tailBounds.min.z-.035;
        for(const side of [-1,1]){
          const light=new THREE.PointLight(0xff0710,0,4.2,2);light.position.set(xMid+side*xOffset,yMid,rearZ);playerCar.add(light);brakePointLights.push(light);driverHiddenParts.push(light);
        }
      }
    }
    brakeState=false;
    const wheelSpecs=[
      {name:"FL_wheel",side:1,front:true},{name:"FR_wheel",side:-1,front:true},
      {name:"RL_wheel",side:1,front:false},{name:"RR_wheel",side:-1,front:false}
    ];
    wheelAnimations=wheelSpecs.map(spec=>{
      const object=playerCar.getObjectByName(spec.name);
      if(!object)return null;
      const base=object.quaternion.clone();
      if(spec.front){
        const yaw=new THREE.Euler().setFromQuaternion(base,"YXZ").y;
        const straightYaw=spec.side>0?0:Math.PI;
        const correction=THREE.MathUtils.euclideanModulo(straightYaw-yaw+Math.PI,Math.PI*2)-Math.PI;
        base.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),correction));
      }
      return {object,base,side:spec.side,front:spec.front};
    }).filter(Boolean);
    steeringWheelLogo=playerCar.getObjectByName("Steering_wheel_car_logo");
    if(steeringWheelLogo){
      playerCar.updateWorldMatrix(true,true);
      const leatherMesh=playerCar.getObjectByName("Interior_Leather_0"),mainInteriorMesh=playerCar.getObjectByName("Interior_Interior_main_0");
      const parent=leatherMesh?.parent,centerWorld=steeringWheelLogo.getWorldPosition(new THREE.Vector3());
      if(parent&&mainInteriorMesh?.parent===parent){
        const pivotPosition=parent.worldToLocal(centerWorld.clone());
        steeringWheelRig=new THREE.Group();steeringWheelRig.position.copy(pivotPosition);steeringWheelRig.position.z-=.012;steeringWheelRig.name="White steering wheel";
        let separatedParts=0;
        for(const partMesh of [leatherMesh,mainInteriorMesh]){
          if(!partMesh?.isMesh||!partMesh.geometry.index)continue;
          const sourceGeometry=partMesh.geometry,position=sourceGeometry.attributes.position,index=sourceGeometry.index.array,meshToParent=partMesh.matrix.clone();
          const parentVertices=new Float32Array(position.count*3),vertex=new THREE.Vector3();
          for(let i=0;i<position.count;i++){
            vertex.fromBufferAttribute(position,i).applyMatrix4(meshToParent);
            parentVertices[i*3]=vertex.x;parentVertices[i*3+1]=vertex.y;parentVertices[i*3+2]=vertex.z;
          }
          const wheelIndices=[],bodyIndices=[];
          for(let i=0;i<index.length;i+=3){
            const a=index[i],b=index[i+1],c=index[i+2];
            const cx=(parentVertices[a*3]+parentVertices[b*3]+parentVertices[c*3])/3;
            const cy=(parentVertices[a*3+1]+parentVertices[b*3+1]+parentVertices[c*3+1])/3;
            const cz=(parentVertices[a*3+2]+parentVertices[b*3+2]+parentVertices[c*3+2])/3;
            const dx=cx-pivotPosition.x,dy=cy-pivotPosition.y,dz=cz-pivotPosition.z;
            const target=Math.abs(dz)<.05&&dx*dx+dy*dy<.24*.24;
            (target?wheelIndices:bodyIndices).push(a,b,c);
          }
          if(wheelIndices.length<300)continue;
          const bodyGeometry=sourceGeometry.clone();bodyGeometry.clearGroups();bodyGeometry.setIndex(new THREE.BufferAttribute(new Uint32Array(bodyIndices),1));bodyGeometry.computeBoundingSphere();partMesh.geometry=bodyGeometry;
          separatedParts++;
        }
        if(separatedParts){
          parent.add(steeringWheelRig);steeringWheelLogo.visible=false;
          const whiteLeather=new THREE.MeshStandardMaterial({color:0xf4f5f2,roughness:.32,metalness:.08});
          const whiteMetal=new THREE.MeshStandardMaterial({color:0xd8dfdf,roughness:.25,metalness:.48});
          const whiteHub=new THREE.MeshStandardMaterial({color:0xf9faf7,roughness:.24,metalness:.16});
          function addWhiteWheelPart(geometry,material,position,rotation){
            const part=new THREE.Mesh(geometry,material);part.position.set(...position);if(rotation)part.rotation.set(...rotation);part.castShadow=true;part.receiveShadow=true;steeringWheelRig.add(part);return part;
          }
          addWhiteWheelPart(new THREE.TorusGeometry(.175,.022,14,56),whiteLeather,[0,0,0]);
          addWhiteWheelPart(new THREE.TorusGeometry(.148,.004,8,48),whiteMetal,[0,0,-.004]);
          for(const angle of [Math.PI/2,Math.PI*7/6,Math.PI*11/6]){
            const spoke=addWhiteWheelPart(new THREE.BoxGeometry(.027,.125,.032),whiteMetal,[Math.cos(angle)*.102,Math.sin(angle)*.102,-.008]);
            spoke.rotation.z=angle-Math.PI/2;
          }
          addWhiteWheelPart(new THREE.CylinderGeometry(.052,.057,.04,32),whiteHub,[0,0,-.014],[Math.PI/2,0,0]);
          addWhiteWheelPart(new THREE.CylinderGeometry(.031,.031,.043,32),whiteMetal,[0,0,-.016],[Math.PI/2,0,0]);
          steeringWheelBase=steeringWheelRig.quaternion.clone();
        }else{steeringWheelRig=null;console.warn("Could not remove the original steering wheel from the interior mesh")}
      }
    }
    applyCameraMode();
    message.querySelector("span").textContent="กด W หรือ ↑ เพื่อออกเดินทาง";
  },error=>{
    console.error("Could not load the car model",error);
    message.querySelector("span").textContent="โหลดโมเดล Porsche ไม่สำเร็จ ลองเปิดไฟล์ใหม่อีกครั้ง";
  });
  let speed=0,dist=0,offset=0,steer=0,worldZ=0,elapsed=0,last=performance.now(),toastTime=0,started=false,gear=1;
  const maxSpeed=510;
  const gearSpeed=[0,85,160,245,340,430,maxSpeed];
  const gearAcceleration=[0,82,64,49,38,30,24];
  function changeGear(amount){gear=THREE.MathUtils.clamp(gear+amount,1,6);gearText.textContent=String(gear)}
  document.querySelector("#gearDown").addEventListener("click",()=>changeGear(-1));
  document.querySelector("#gearUp").addEventListener("click",()=>changeGear(1));
  function showToast(){toast.classList.add("show");toastTime=1.1}
  function update(dt){
    const gas=held.has("ArrowUp")||held.has("w")||held.has("W");const brake=held.has("ArrowDown")||held.has("s")||held.has("S");
    const left=held.has("ArrowLeft")||held.has("a")||held.has("A");const right=held.has("ArrowRight")||held.has("d")||held.has("D");
    const gearOverspeed=Math.max(0,speed-gearSpeed[gear]);
    if(gearOverspeed>0)speed=Math.max(gearSpeed[gear],speed-Math.min(72,gearOverspeed*1.8)*dt);
    if(gas){started=true;if(speed<gearSpeed[gear])speed=Math.min(gearSpeed[gear],speed+gearAcceleration[gear]*dt)}else speed=Math.max(0,speed-(brake?100:8)*dt);
    if(brake)speed=Math.max(0,speed-83*dt);
    setBrakeLights(brake);
    const steerInput=(right?1:0)-(left?1:0);steer+=(steerInput-steer)*Math.min(1,dt*5.5);
    offset+=steer*dt*(1.6+speed*.012);offset*=Math.pow(.985,dt*60);
    const roadHalfWidth=roadWidth*.5;
    if(Math.abs(offset)>roadHalfWidth+.75){speed=Math.max(0,speed-65*dt);offset=THREE.MathUtils.clamp(offset,-roadHalfWidth-1.4,roadHalfWidth+1.4);if(Math.random()<dt*3)showToast()}
    if(Math.abs(offset)>roadHalfWidth+1.4){offset=THREE.MathUtils.clamp(offset,-roadHalfWidth-1.4,roadHalfWidth+1.4)}
    const travel=speed/3.6*dt;dist+=travel/1000;elapsed+=dt;
    wheelSpin=(wheelSpin+travel/.34)%(Math.PI*2);
    const axleAxis=new THREE.Vector3(1,0,0),steerAxis=new THREE.Vector3(0,1,0);
    for(const wheel of wheelAnimations){
      const spinRotation=new THREE.Quaternion().setFromAxisAngle(axleAxis,wheelSpin*wheel.side);
      if(wheel.front){
        const steeringRotation=new THREE.Quaternion().setFromAxisAngle(steerAxis,-steer*.42);
        wheel.object.quaternion.copy(wheel.base).multiply(steeringRotation).multiply(spinRotation);
      }else wheel.object.quaternion.copy(wheel.base).multiply(spinRotation);
    }
    if(steeringWheelRig&&steeringWheelBase){
      const handRotation=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),steer*1.55);
      steeringWheelRig.quaternion.copy(steeringWheelBase).multiply(handRotation);
    }
    worldZ-=travel;
    const roadX=centerX(worldZ);playerRig.position.set(roadX+offset,.18,worldZ);
    const aheadX=centerX(worldZ-80)-roadX;playerRig.rotation.y=Math.PI-Math.atan2(aheadX,80)-steer*.045;
    if(cameraMode==="chase")updateChaseCamera();else camera.rotation.z=-steer*.018;
    if(worldZ < -roadLength){
      worldZ+=roadLength;
      playerRig.position.z=worldZ;
      for(const section of trackSections)section.position.z+=roadLength;
      const sectionBehind=trackSections.find(section=>section.position.z>worldZ+roadLength/2);
      if(sectionBehind)sectionBehind.position.z=-roadLength;
    }
    const rpm=Math.round(900+speed/gearSpeed[gear]*6700);
    if(audioContext&&engineOscillator&&engineHarmonic&&engineFilter&&engineGain&&audioContext.currentTime-lastEngineAudioUpdate>.045){
      const now=audioContext.currentTime,firingHz=rpm/20;
      engineOscillator.frequency.setTargetAtTime(firingHz,now,.045);engineHarmonic.frequency.setTargetAtTime(firingHz*2,now,.045);
      engineFilter.frequency.setTargetAtTime(480+gas*1350+speed/maxSpeed*280,now,.08);
      engineGain.gain.setTargetAtTime(started ? .012+gas*.034+speed/maxSpeed*.008 : .0001,now,.09);lastEngineAudioUpdate=now;
    }
    speedText.textContent=String(Math.round(speed)).padStart(3,"0");distanceText.textContent=dist.toFixed(2);gearText.textContent=String(gear);rpmText.textContent=`RPM ${String(rpm).padStart(4,"0")}`;
    message.classList.toggle("hide",started&&!!playerCar);if(toastTime>0){toastTime-=dt;if(toastTime<=0)toast.classList.remove("show")}
  }
  function draw(){renderer.render(scene,camera)}
  function animate(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(animate)}
  requestAnimationFrame(animate);
  function resize(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    const mobilePixelCap = (matchMedia('(pointer:coarse)').matches || innerWidth < 900) ? 1.3 : 1.7;
    renderer.setPixelRatio(Math.min(devicePixelRatio, mobilePixelCap));
    renderer.setSize(innerWidth,innerHeight);
  }
  addEventListener("resize",resize);
  addEventListener("orientationchange",()=>setTimeout(resize,120));
  document.addEventListener("visibilitychange",()=>{if(document.hidden)held.clear();});
  addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();held.add(e.key);if(e.key.toLowerCase()==="w"||e.key==="ArrowUp")startEngineAudio();if(!e.repeat&&e.key.toLowerCase()==="e")changeGear(1);if(!e.repeat&&e.key.toLowerCase()==="q")changeGear(-1);if(e.key.toLowerCase()==="c"){cameraMode=cameraMode==="driver"?"chase":"driver";applyCameraMode()}if(e.key.toLowerCase()==="r")location.reload()});
  addEventListener("keyup",e=>held.delete(e.key));addEventListener("blur",()=>held.clear());
  document.querySelectorAll(".touch").forEach(button=>{
    const key=button.dataset.key;
    button.addEventListener("pointerdown",e=>{e.preventDefault();held.add(key);if(key==="w"||key==="ArrowUp")startEngineAudio();try{button.setPointerCapture(e.pointerId)}catch(_){}});
    for(const name of ["pointerup","pointercancel","lostpointercapture"])button.addEventListener(name,()=>held.delete(key));
    button.addEventListener("contextmenu",e=>e.preventDefault());
  });
  // ล็อก landscape ถ้าเบราว์เซอร์รองรับ (เฉพาะมือถือ)
  if(matchMedia('(pointer:coarse)').matches && screen.orientation?.lock){
    screen.orientation.lock('landscape').catch(()=>{});
  }
})();
</script>
